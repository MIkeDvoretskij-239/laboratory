<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — Lab Calibration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>.card-body input[type="text"], .card-body input[type="password"] { width: 100%; padding: .375rem .75rem; border: 1px solid #ced4da; border-radius: .375rem; }</style>
</head>
<body class="bg-light">
<div class="container" style="max-width: 380px; margin-top: 10vh;">
    <h1 class="h4 mb-4 text-center">Lab Calibration</h1>
    <div class="card">
        <div class="card-body">
            {% if form.errors %}
                <div class="alert alert-danger">Неверный логин или пароль.</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Логин</label>
                    {{ form.username }}
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    {{ form.password }}
                </div>
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit" class="btn btn-primary w-100">Войти</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
